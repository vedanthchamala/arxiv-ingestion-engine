[package]
name = "poller"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { version = "0.1.0", path = "../common" }
metrics = "0.24.6"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
redis = { version = "1.7.0", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "query"] }
roxmltree = "0.21.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
