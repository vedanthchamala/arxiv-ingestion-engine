[package]
name = "fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { version = "0.1.0", path = "../common" }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "gzip", "query"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokenizers = { version = "0.23.2", default-features = false, features = ["http", "fancy-regex"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs"] }
tracing = "0.1.44"
