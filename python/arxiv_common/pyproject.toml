[project]
name = "arxiv-common"
version = "0.1.0"
description = "Shared models, schema validation, inference client, and pgvector access for the arXiv ingestion engine."
readme = "README.md"
authors = [
    { name = "Vedanth Chamala", email = "vedhuchamala@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "redis>=5",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
